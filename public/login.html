<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>On-Tour Admin Login</title><style>body{margin:0;background:#06101e;color:#edf5ff;font:16px system-ui;min-height:100vh;display:grid;place-items:center}.card{background:#10243d;border:1px solid #294662;padding:35px;border-radius:18px;width:min(90vw,390px)}h1{margin-top:0}input,button{width:100%;padding:14px;border-radius:10px;box-sizing:border-box;margin:10px 0;font-size:16px}input{background:#06101e;border:1px solid #45617f;color:white}button{border:0;background:#1464d9;color:white;font-weight:bold;cursor:pointer}a{color:#9bbfff}#err{color:#ff9898}</style></head><body><form class="card" id="login"><h1>On-Tour Admin</h1><p>Sign in to create a tour room.</p><input id="password" type="password" placeholder="Admin password" required autocomplete="current-password"><button>Sign In</button><p id="err" role="alert"></p><a href="/">Back to homepage</a></form><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(r.ok)location.href='/admin';else document.getElementById('err').textContent=(await r.json()).error||'Login failed';};</script></body></html>
